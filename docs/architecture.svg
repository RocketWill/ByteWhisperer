<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">ByteWhisperer cross-language inference architecture</title>
  <desc id="description">C++, Python, and C# applications connect through language-specific interoperability layers to a native YOLOv8 SDK, OpenVINO runtime, and ONNX model.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .accent { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .runtime { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrowhead); }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .label { fill: #0f172a; font-size: 17px; font-weight: 600; }
      .detail { fill: #475569; font-size: 14px; font-weight: 400; }
      .caption { fill: #64748b; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="520" rx="18"/>
  <text class="title" x="50" y="55">Cross-language inference path</text>
  <text class="detail" x="50" y="82">One native inference interface, three application languages</text>

  <text class="caption" x="50" y="125">HOST APPLICATIONS</text>
  <rect class="panel" x="50" y="145" width="190" height="92" rx="12"/>
  <text class="label" x="145" y="182" text-anchor="middle">C++</text>
  <text class="detail" x="145" y="208" text-anchor="middle">LoadLibrary</text>

  <rect class="panel" x="50" y="259" width="190" height="92" rx="12"/>
  <text class="label" x="145" y="296" text-anchor="middle">Python</text>
  <text class="detail" x="145" y="322" text-anchor="middle">ctypes</text>

  <rect class="panel" x="50" y="373" width="190" height="92" rx="12"/>
  <text class="label" x="145" y="410" text-anchor="middle">C#</text>
  <text class="detail" x="145" y="436" text-anchor="middle">P/Invoke</text>

  <rect class="boundary" x="300" y="125" width="230" height="360" rx="16"/>
  <text class="caption" x="325" y="155">INTEROP BOUNDARY</text>
  <rect class="accent" x="325" y="180" width="180" height="92" rx="12"/>
  <text class="label" x="415" y="217" text-anchor="middle">Native C ABI</text>
  <text class="detail" x="415" y="243" text-anchor="middle">Struct and symbol mapping</text>

  <rect class="panel" x="325" y="306" width="180" height="125" rx="12"/>
  <text class="label" x="415" y="342" text-anchor="middle">Inference lifecycle</text>
  <text class="detail" x="415" y="370" text-anchor="middle">Create · Detect</text>
  <text class="detail" x="415" y="394" text-anchor="middle">Read results · Destroy</text>

  <text class="caption" x="590" y="125">NATIVE RUNTIME</text>
  <rect class="accent" x="590" y="180" width="210" height="125" rx="12"/>
  <text class="label" x="695" y="225" text-anchor="middle">YOLOv8 SDK DLL</text>
  <text class="detail" x="695" y="253" text-anchor="middle">Preprocess · inference</text>
  <text class="detail" x="695" y="277" text-anchor="middle">Postprocess · detections</text>

  <rect class="runtime" x="855" y="180" width="190" height="125" rx="12"/>
  <text class="label" x="950" y="225" text-anchor="middle">OpenVINO</text>
  <text class="detail" x="950" y="253" text-anchor="middle">Runtime execution</text>
  <text class="detail" x="950" y="277" text-anchor="middle">CPU / GPU plugin</text>

  <rect class="panel" x="855" y="355" width="190" height="92" rx="12"/>
  <text class="label" x="950" y="392" text-anchor="middle">YOLOv8 ONNX</text>
  <text class="detail" x="950" y="418" text-anchor="middle">Model artifact</text>

  <path class="arrow" d="M240 191 H325"/>
  <path class="arrow" d="M240 305 H292 Q310 305 325 285"/>
  <path class="arrow" d="M240 419 H292 Q310 419 325 405"/>
  <path class="arrow" d="M505 242 H590"/>
  <path class="arrow" d="M800 242 H855"/>
  <path class="arrow" d="M950 355 V305"/>

  <text class="detail" x="558" y="224" text-anchor="middle">calls</text>
  <text class="detail" x="827" y="224" text-anchor="middle">executes</text>
  <text class="detail" x="973" y="334">loads</text>
</svg>
