<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">ByteWhisperer native inference interoperability architecture</title>
  <desc id="description">C++, Python, and C# applications use language-specific adapters to call a native inference SDK. An ONNX model and OpenVINO runtime are shown separately as the current example.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .adapter { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .sdk { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .reference { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .boundary { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrowhead); }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { fill: #0f172a; font-size: 24px; font-weight: 700; }
      .label { fill: #0f172a; font-size: 17px; font-weight: 600; }
      .detail { fill: #475569; font-size: 14px; font-weight: 400; }
      .caption { fill: #64748b; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="560" rx="18"/>
  <text class="title" x="50" y="55">Native inference interoperability</text>
  <text class="detail" x="50" y="82">A reusable integration pattern with one concrete reference implementation</text>

  <text class="caption" x="50" y="125">HOST APPLICATIONS</text>
  <rect class="panel" x="50" y="145" width="170" height="82" rx="12"/>
  <text class="label" x="135" y="180" text-anchor="middle">C++</text>
  <text class="detail" x="135" y="204" text-anchor="middle">LoadLibrary</text>
  <rect class="panel" x="50" y="245" width="170" height="82" rx="12"/>
  <text class="label" x="135" y="280" text-anchor="middle">Python</text>
  <text class="detail" x="135" y="304" text-anchor="middle">ctypes</text>
  <rect class="panel" x="50" y="345" width="170" height="82" rx="12"/>
  <text class="label" x="135" y="380" text-anchor="middle">C#</text>
  <text class="detail" x="135" y="404" text-anchor="middle">P/Invoke</text>

  <text class="caption" x="285" y="125">LANGUAGE ADAPTERS</text>
  <rect class="adapter" x="285" y="145" width="205" height="282" rx="14"/>
  <text class="label" x="387" y="190" text-anchor="middle">Interop layer</text>
  <text class="detail" x="387" y="224" text-anchor="middle">Symbol loading</text>
  <text class="detail" x="387" y="252" text-anchor="middle">Structure mapping</text>
  <text class="detail" x="387" y="280" text-anchor="middle">Buffer transfer</text>
  <text class="detail" x="387" y="308" text-anchor="middle">Result conversion</text>
  <text class="detail" x="387" y="336" text-anchor="middle">Resource cleanup</text>

  <text class="caption" x="555" y="125">STABLE INTEGRATION BOUNDARY</text>
  <rect class="sdk" x="555" y="145" width="250" height="282" rx="14"/>
  <text class="label" x="680" y="190" text-anchor="middle">Native Inference SDK</text>
  <text class="detail" x="680" y="230" text-anchor="middle">Create instance</text>
  <text class="detail" x="680" y="258" text-anchor="middle">Submit input</text>
  <text class="detail" x="680" y="286" text-anchor="middle">Run inference</text>
  <text class="detail" x="680" y="314" text-anchor="middle">Return structured results</text>
  <text class="detail" x="680" y="342" text-anchor="middle">Destroy instance</text>

  <rect class="boundary" x="865" y="115" width="285" height="355" rx="16"/>
  <text class="caption" x="890" y="145">CURRENT EXAMPLE</text>
  <rect class="reference" x="890" y="170" width="235" height="82" rx="12"/>
  <text class="label" x="1007" y="204" text-anchor="middle">OpenVINO Runtime</text>
  <text class="detail" x="1007" y="228" text-anchor="middle">Windows x64 execution</text>
  <rect class="panel" x="890" y="278" width="235" height="82" rx="12"/>
  <text class="label" x="1007" y="312" text-anchor="middle">Example ONNX Model</text>
  <text class="detail" x="1007" y="336" text-anchor="middle">Example model artifact</text>
  <rect class="panel" x="890" y="386" width="235" height="58" rx="12"/>
  <text class="detail" x="1007" y="421" text-anchor="middle">Replaceable implementation</text>

  <path class="arrow" d="M220 186 H285"/>
  <path class="arrow" d="M220 286 H285"/>
  <path class="arrow" d="M220 386 H285"/>
  <path class="arrow" d="M490 286 H555"/>
  <path class="arrow" d="M805 286 H865"/>
  <path class="arrow" d="M1007 278 V252"/>

  <text class="detail" x="522" y="270" text-anchor="middle">calls</text>
  <text class="detail" x="835" y="270" text-anchor="middle">uses</text>

  <rect class="panel" x="285" y="485" width="520" height="42" rx="10"/>
  <text class="detail" x="545" y="511" text-anchor="middle">The SDK contract stays central; the model and runtime can change.</text>
</svg>
